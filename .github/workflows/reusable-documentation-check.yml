name: Reusable documentation check

on:
  workflow_call:
    inputs:
      markdown-globs:
        description: Markdown files checked by markdownlint
        required: false
        type: string
        default: "**/*.md"
      link-args:
        description: Arguments passed to lychee
        required: false
        type: string
        default: '--no-progress --offline "**/*.md"'

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Markdown style
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: ${{ inputs.markdown-globs }}

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: ${{ inputs.link-args }}
          fail: true
