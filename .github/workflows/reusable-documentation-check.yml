name: Reusable documentation check

on:
  workflow_call:
    inputs:
      markdown-globs:
        description: Markdown files checked by markdownlint
        required: false
        type: string
        default: "**/*.md"
      link-args:
        description: Arguments passed to lychee
        required: false
        type: string
        default: '--no-progress --offline "**/*.md"'

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Markdown style
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: ${{ inputs.markdown-globs }}

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: ${{ inputs.link-args }}
          fail: true
